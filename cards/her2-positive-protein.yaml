id: her2-positive-protein
title: HER2 protein in HER2-positive vs HER2-negative primary tumors
short_title: HER2 by HER2 status
intended_use: A descriptive comparison of HER2 protein (RPPA) between primary tumors that are HER2-positive and HER2-negative.
group_studied: Primary tumors (sample type 01) with protein data and a HER2 status.
outcome: Mean HER2 protein (the HER2 row of protein_rppa.tsv.gz) by HER2 status.
acceptable_limitations: Up to 10% of tumors without a usable HER2 status, if reported.
not_acceptable: Defining HER2 status from a field that conflicts with another HER2 field, without saying which was used.
out_of_scope: Treatment advice (including HER2-targeted therapy), risk scores or any clinical claim.
uses:
  clinical.tsv: [lab_proc_her2_neu_immunohistochemistry_receptor_status, HER2_Final_Status_nature2012]
  protein_rppa.tsv.gz: [HER2]
group:
  sample_type: "01"
  in_files: [protein_rppa.tsv.gz]
limits:
  missing_fraction: 0.10
checks: [inputs_present, her2_field_conflict, missing_values, site_shift]
