# Look and feel of the review screen. System fonts only, so it looks the same offline at the venue.
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F8"
textColor = "#132A3A"
linkColor = "#0F766E"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
baseRadius = "0.4rem"
buttonRadius = "0.4rem"
borderColor = "#E2E8EE"
showWidgetBorder = true
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#F3F6F8"
# Charts: one teal accent, then greys (status colours are kept for the badges).
chartCategoricalColors = ["#0F766E", "#64748B", "#94A3B8", "#134E4A"]

[theme.sidebar]
backgroundColor = "#0E2433"
secondaryBackgroundColor = "#173447"
textColor = "#E8F0F4"
primaryColor = "#5EEAD4"
borderColor = "#24475C"

[server]
address = "localhost"
headless = true

[browser]
gatherUsageStats = false

# The screen is shown to judges: hide the Deploy button and the developer menu items.
[client]
toolbarMode = "viewer"
